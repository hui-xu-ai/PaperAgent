name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest（Windows / Python 3.12）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖（三包可编辑安装）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e packages/paperparse
          python -m pip install -e packages/paperkb

      - name: 单测（三包全量）
        run: python -m pytest -q

      - name: 发布闸门（版本 / 数据兼容 / 打包自检 / 文档）
        run: python tools/release_check.py --full
