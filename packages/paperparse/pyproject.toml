# packages/paperparse/pyproject.toml
# PaperAgent 统一算法包：PDF 解析 + HTML 识别 + HTML 辅助 PDF 解析自我训练
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperparse"
version = "2.3.0"
description = "PaperAgent 统一算法包：PDF 解析 + HTML 识别 + HTML 辅助 PDF 解析自我训练（主 agent 经 api 门面调用）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "requests>=2.31",
    "pydantic>=2.6,<3",
    "jinja2>=3.1",
    "rich>=13",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    # 化学式校验（core/consensus_scan.py）/ LaTeX 合法性（core/latex_util.py）——**一直漏声明**：
    # CI 首次在干净环境跑才暴露（本地 venv 恰好装过）。缺了不会崩，而是**静默降级**成
    # "校验永远不通过"，属于会悄悄毁掉解析质量的坑。
    "pyvalem>=2.6",
    "pylatexenc>=2.10",
    "latex2mathml>=3.77",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
web = ["beautifulsoup4>=4.12", "markdownify>=0.12", "lxml>=5"]
llm = ["openai>=1.30"]

[tool.setuptools.packages.find]
where = ["."]
include = ["paperparse*", "paper_reader*"]
