[project]
name = "paperagent"
version = "1.0.0"
description = "轻量文献 AI 阅读与翻译 Web 应用（FastAPI + paper-reader 引擎 + DeepSeek API）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6,<3",
    # 后端直接 import 的（先前靠"本地恰好装过"掩盖，干净环境会 ImportError）：
    "PyYAML>=6",       # app/services/plugin_registry.py（插件清单）
    "pymupdf>=1.24",   # app/services/review_service.py（复核页 PDF 页图）
    "requests>=2.31",  # 后端直连 MinerU/LLM 的 HTTP 调用
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]
# 桌面窗口/托盘模式（app/desktop.py 里**懒加载**：不装只影响打包版窗口，不影响 Web 模式）
desktop = [
    "pywebview>=5",
    "pystray>=0.19",
    "Pillow>=10",
]

[project.scripts]
paperagent = "app.main:run"

# 本仓库是"多顶层目录"布局（backend/ frontend/ packages/ tools/ rules/ …），
# 不声明打包范围时 setuptools 会直接报错：
#   error: Multiple top-level packages discovered in a flat-layout: ['rules','assets','backend',…]
# ⇒ 显式声明：Python 包只有 backend/app（CI/干净机器上 `pip install -e .` 必须能装）。
[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
namespaces = false

[tool.pytest.ini_options]
# 三包全跑（旧配置只跑 backend/tests → 519 个解析/知识库测试默认不执行，
# 改善无法证明；2026-09-12 起默认全量，基线见 README/SHORT-TERM）。
testpaths = ["backend/tests", "packages/paperkb/tests", "packages/paperparse/tests", "packages/paperlit/tests"]
# CI/干净环境：即使没装 editable 根包，测试也能 import app（双保险）
pythonpath = ["backend", "packages/paperparse", "packages/paperkb", "packages/paperlit"]
addopts = "-q"
cache_dir = ".tmp_test/.pytest_cache"
